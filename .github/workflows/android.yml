name: Build Street2Home APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Street2Home-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
